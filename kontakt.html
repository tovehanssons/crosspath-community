<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossPath</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <script src="js/contact.js" defer></script>
</head>

<body>
    <header>

        <!--Logotyp-->
        <a href="index.html" class="logotyp">
            <img src="images/crosspath-logo.svg"
                alt="CrossPaths logotyp. Den föreställer ett större och ett mindre berg. Logotypen är helt vit">
            <span>CrossPath</span>
        </a>
        <!--Knapp för hamburgermenyn-->
        <button class="menu-toggle">☰</button>

        <!--Navigeringsmenyn-->
        <nav class="menu">
            <ul>
                <li><a href="index.html">Start</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="community.html">Community</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!--Kontaktformuläret där man kan skriva ett meddelande-->
        <section class="contact">

            <h1>Kontakta oss</h1>
            <p>Har du frågor eller funderingar? Hör gärna av dig!
            </p>

            <!--Samlar upp fälten och knapparna i kontaktformuläret-->
            <form id="contact-form">

                <!--Här lägger JavaScript in felmeddelanden om något är fel i kontaktformuläret-->
                <ul id="error-list" class="error"></ul>

                <label for="name">Namn</label>
                <input type="text" id="name">

                <label for="email">E-postadress</label>
                <input type="text" id="email">

                <label for="message">Meddelande</label>
                <textarea id="message"></textarea>

                <!--Skickar meddelandet och en knapp för att rensa formuläret-->
                <button type="submit">Skicka meddelande</button>
                <button type="button" id="clear-btn">Rensa</button>

            </form>
        </section>
    </main>

    <!--Footer-sektionen med kontaktinfo, länkar och logotyp-->

    <footer>
        <a href="index.html" class="footer-logo">
            <img src="images/crosspath-logo.svg"
                alt="CrossPaths logotyp. Den föreställer ett större och ett mindre berg. Logotypen är helt vit">
            CrossPath
        </a>

        <!--Länkar till sociala medier-->
        <div class="footer-social">

            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.svg" alt="En symbol för Instagram">
            </a>

            <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.svg" alt="En symbol för Facebook">
            </a>

            <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
                <img src="images/tiktok.svg" alt="En symbol för TikTok">
            </a>

        </div>

        <nav>
            <ul>
                <li><a href="index.html">Start</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="community.html">Community</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
        <!--Företagets adress-->
        <address>
            CrossPath AB, Fjällstigen 25, 702 12 Åre
        </address>

        <!-- Copyright -->
        <p>© 2026 CrossPath</p>

    </footer>

</body>

</html>
